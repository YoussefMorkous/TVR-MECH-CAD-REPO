name: Helper tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Verify access to shared edit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 tools/cad.py status
